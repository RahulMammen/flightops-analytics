[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightops"
version = "1.0.0"
description = "DuckDB + SQL analytics pipeline over synthetic fictional flight operations"
requires-python = ">=3.11"
authors = [{ name = "Rahul Tom Mammen" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
